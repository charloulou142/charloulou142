<script>
  // Thème choisi par le visiteur (bouton lune / soleil), sinon celui de l'appareil
  (function(){
    var d=document.documentElement, t=null;
    try{ t=localStorage.getItem('audioloc_theme'); }catch(e){}
    if(t==='light'||t==='dark') d.dataset.theme=t;
    function sombre(){ return d.dataset.theme ? d.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
    function barre(){ document.querySelectorAll('meta[name=theme-color]').forEach(function(m){ m.removeAttribute('media'); m.content=sombre()?'#0B0714':'#F3EFF8'; }); }
    if(t) document.addEventListener('DOMContentLoaded',barre);
    document.addEventListener('click',function(e){
      if(!e.target.closest('.theme-btn')) return;
      var nouveau = sombre() ? 'light' : 'dark';
      function appliquer(){ d.dataset.theme = nouveau; barre(); }
      try{ localStorage.setItem('audioloc_theme', nouveau); }catch(e){}
      var b = e.target.closest('.theme-btn').getBoundingClientRect(), x = b.left + b.width/2, y = b.top + b.height/2;
      if (document.startViewTransition) {
        var r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        document.startViewTransition(appliquer).ready.then(function(){
          d.animate({ clipPath: ['circle(0px at '+x+'px '+y+'px)', 'circle('+r+'px at '+x+'px '+y+'px)'] },
                    { duration: 600, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' });
        });
      } else {
        d.classList.add('theme-anim'); appliquer();
        setTimeout(function(){ d.classList.remove('theme-anim'); }, 500);
      }
    });
  })();
</script>

<script>
  // Lit le statut de la réservation à partir du lien personnel reçu par e-mail ou WhatsApp (?t=…). Aucune donnée personnelle affichée.
  (async () => {
    const API = 'https://script.google.com/macros/s/AKfycbwqR6HDTI4lbDZxqtruraOBJUklTni0lYWXLAFTAqC_xQABtG40MJ0W2dYDp7xZK0hs/exec';
    const carte = document.getElementById('carte');
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const t = new URLSearchParams(location.search).get('t') || '';
    if (!/^[a-f0-9]{24}$/.test(t)) { carte.innerHTML = '<p>Ce lien de suivi est incomplet. Ouvre le lien reçu par e-mail ou WhatsApp, ou contacte-nous.</p>'; return; }
    async function afficher(info) {
      try {
        const j = await (await fetch(API + '?action=suivi&t=' + t + '&nc=' + Date.now())).json();
        if (!j.ok) throw new Error(j.erreur || 'introuvable');
        const etapes = ['Demande reçue', 'Confirmée', 'Livrée', 'Terminée'];
        carte.innerHTML = (info ? '<p style="margin-bottom:14px;font-weight:600">' + esc(info) + '</p>' : '') +
          '<span class="statut">' + esc(j.statut) + '</span><p class="explic">' + esc(j.explication) + '</p>' +
          '<ol class="etapes' + (j.etape < 0 ? ' annule' : '') + '">' + etapes.map((e, i) => '<li class="' + (j.etape >= i ? 'ok' : '') + '">' + e + '</li>').join('') + '</ol>' +
          '<dl><dt>Date</dt><dd>' + esc(j.date) + '</dd><dt>Matériel</dt><dd>' + esc(j.offre) + '</dd>' +
          (j.prix ? '<dt>Prix</dt><dd>' + esc(j.prix) + ' <small style="font-weight:400;color:var(--muted)">hors livraison et caution</small></dd>' : '') + '</dl>' +
          (j.annulable ? '<div class="annul"><button type="button" id="b-annul">Annuler ma réservation</button><p>Possible jusqu\'à la veille de la date. Le jour même, appelle-nous au 06 22 12 39 63.</p><p class="erreur" id="m-annul" hidden></p></div>' : '');
        const b = document.getElementById('b-annul');
        if (b) b.addEventListener('click', async () => {
          if (!confirm('Annuler ta réservation du ' + j.date + ' ?\nLe matériel ne sera plus réservé pour toi.')) return;
          b.disabled = true; b.textContent = 'Annulation en cours…';
          try {
            const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'annuler_client', t }) })).json();
            if (!r.ok) throw new Error(r.erreur || 'erreur');
            afficher('Ta réservation est annulée. On t\'envoie une confirmation par e-mail si tu nous as laissé ton adresse.');
          } catch (err) {
            b.disabled = false; b.textContent = 'Annuler ma réservation';
            const m = document.getElementById('m-annul'); m.hidden = false;
            m.textContent = 'L\'annulation n\'a pas marché' + (err.message && err.message !== 'erreur' ? ' (' + err.message + ')' : '') + '. Appelle-nous ou écris-nous sur WhatsApp.';
          }
        });
      } catch (e) {
        carte.innerHTML = '<p>Réservation introuvable pour ce lien. Contacte-nous et on vérifie tout de suite.</p>';
      }
    }
    afficher();
  })();
</script>
